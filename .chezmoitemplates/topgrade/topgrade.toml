[misc]
ignore_failures = ["winget"]
no_retry = true
cleanup = true
only = ["chocolatey", "powershell", "scoop", "self_update", "winget"]

[windows]
# Causes Topgrade to rename itself during the run to allow package managers
# to upgrade it. Use this only if you installed Topgrade by using a package
# manager such as Scoop, Cargo or Chocolatey
self_rename = true


