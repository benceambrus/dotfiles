# Basic settings
# Set prefix to C-a
set -g prefix C-a
## Remove old prefix
unbind C-b
## Send C-a to apps by pressing it twice
bind C-a send-prefix

# Options
## Window and pane indices
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

## Other
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g history-limit 1000000
set -g set-clipboard on

# Bindings
## Window splitting
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind z split-window -v -c "#{pane_current_path}"

## Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy mode changes
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# uncomment this if mouse scroll shouldn't enter copy-mode
# unbind -T copy-mode-vi MouseDragEnd1Pane

# Pane colors
set -g pane-border-style "fg=#888888"
set -g pane-active-border-style "fg=#ff9e64"

# Status bar
set -g status-bg "#ff9e64"
set -g window-status-current-format "#[fg=#111111] #I: #[fg=#00FF00]() #[fg=#111111]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev)"
set -g status-right "#[fg=#111111] #W - #S"
set -g status-left " "

