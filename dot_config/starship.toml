# ~/.config/starship.toml

# Inserts a blank line between shell prompts
add_newline = true

# Change the default prompt format
# format = """\
# [╭╴](#905AFF)$env_var\
# $all[╰─](#905AFF)$character"""

format = """\
$username$hostname$directory$git_branch$git_status$fill$all\
$character\
"""

# Change the default prompt characters
[character]
success_symbol = "[❯](#b8bb26)"
error_symbol = "[❯](#cc241d)"

# Shows an icon that should be included by zshrc script based on the distribution or os
[env_var.STARSHIP_DISTRO]
format = '[$env_value](bold white)'  # removed space between distro and rest for pwsh
variable = "STARSHIP_DISTRO"
disabled = false

# Shows the username
[username]
style_user = "#4d8676 bold"
style_root = "red bold"
format = "[\ueb99 $user]($style) "
disabled = false  # disable in powershell
show_always = true

[fill]
symbol = " "

[hostname]
ssh_only = false
format = "on $ssh_symbol(#428715)[󰍹 $hostname](#f57d26 bold) "

[directory]
truncation_length = 4
truncation_symbol = "…/"
home_symbol = "~"
read_only_style = "197"
read_only = "  "
style = "#0ca0d8 bold"
format = "in [\uf07b $path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
truncation_length = 10
truncation_symbol = "…/"
style = "bold green"

[git_status]
format = '[\($all_status$ahead_behind\)]($style) '
style = "bold green"
conflicted = "🏳"
up_to_date = " "
untracked = " "
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
stashed = " "
modified = " "
staged = '[++\($count\)](green)'
renamed = "襁 "
deleted = " "

[terraform]
format = "via [ terraform $version]($style) 壟 [$workspace]($style) "

[vagrant]
format = "via [ vagrant $version]($style) "

[docker_context]
format = "via [ $context](bold blue) "

[helm]
format = "via [ $version](bold purple) "

[python]
symbol = " "

[nodejs]
format = "via [ $version](bold green) "
disabled = true

[ruby]
format = "via [ $version]($style) "

[kubernetes]
format = 'on [ $context\($namespace\)](bold purple) '
disabled = false

[kubernetes.context_aliases]
"clcreative-k8s-staging" = "cl-k8s-staging"
"clcreative-k8s-production" = "cl-k8s-prod"
